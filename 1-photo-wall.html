<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hero 1 · Photo Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
<style>
/* 1 · Photo Wall
   Copy on the warm wash, and a wall of real shoot photos in columns that glide in
   opposite directions, endlessly. The cards use the "Pick your lane" language:
   rounded, white border, soft shadow. The wall fades into the wash at the edges
   instead of being cut hard. Hover pauses it; reduced motion freezes it. */
.hero { position: relative; overflow: hidden; background: var(--wash); padding: calc(var(--nav-h) + 1.8rem) 0 0; }
.grid { display: grid; gap: 1.8rem; }
.kicker { font-family: var(--font-display); color: var(--green); font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 0.16em; margin: 0; line-height: 1; }
h1 { margin: 0.3rem 0 0.9rem; font-family: var(--font-display); font-weight: 400; line-height: 0.84; font-size: clamp(4.2rem, 19vw, 8.6rem); color: var(--black); }
h1 .ac { color: var(--green); }
.lede { margin: 0; max-width: 30rem; font-size: clamp(1.05rem, 3.4vw, 1.25rem); color: var(--muted-warm); }
.btn-row { margin-top: 1.5rem; }

.wall {
    position: relative; height: 470px; margin: 0 calc(var(--gutter) * -1);
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; padding: 0 var(--gutter);
    -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
            mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
}
.col { overflow: hidden; }
.reel { animation: up 38s linear infinite; }   /* spacing is a bottom margin, not gap, so -50% lands exactly on the repeat */
.col:nth-child(2) .reel { animation-name: down; animation-duration: 44s; }
.col:nth-child(2) { padding-top: 4.5rem; }   /* staggered columns, so it reads as a wall even when still */
.col:nth-child(3) { padding-top: 1.8rem; }
.col:nth-child(3) .reel { animation-duration: 50s; }
.wall:hover .reel { animation-play-state: paused; }
.card { margin: 0 0 0.7rem; border-radius: 18px; overflow: hidden; border: 4px solid #fff; background: #ddd; box-shadow: 0 12px 26px rgba(10, 9, 8, 0.14); }
.card img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
.col:nth-child(3) { display: none; }
@media (min-width: 600px) and (max-width: 999px) {
    .wall { height: 600px; grid-template-columns: repeat(3, 1fr); }
    .col:nth-child(3) { display: block; }
}
@keyframes up   { from { transform: translateY(0); }    to { transform: translateY(-50%); } }
@keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }

@media (min-width: 1000px) {
    .hero { padding: var(--nav-h) 0 0; }
    .grid { grid-template-columns: 0.9fr 1.1fr; align-items: center; gap: 3rem; }
    .copy { padding: 3rem 0; }
    h1 { font-size: clamp(6rem, 8.4vw, 9rem); }
    .wall { height: min(calc(100vh - var(--nav-h)), 860px); min-height: 640px; margin: 0; padding: 0; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .card { margin-bottom: 1rem; }
    .col:nth-child(3) { display: block; }
}
</style>
</head>
<body>
<header class="nav">
    <div class="wrap">
        <a class="nav-logo" href="#"><img src="images/logo-gold.webp" alt="Hummus &amp; Garlic" width="1000" height="659"></a>
        <ul class="nav-links"><li><a href="#">Home</a></li><li><a href="#">Menu</a></li><li><a href="#">Catering</a></li><li><a href="#">Gift Cards</a></li><li><a href="#">Join the Team</a></li><li><a href="#">Contact</a></li></ul>
        <div class="nav-right"><a class="nav-order" href="#"><i class="fas fa-bag-shopping" aria-hidden="true"></i> Order Online</a><span class="nav-burger" aria-hidden="true"><span></span><span></span><span></span></span></div>
    </div>
</header>

<main>
<section class="hero" aria-labelledby="h1">
    <div class="wrap grid">
        <div class="copy">
            <p class="kicker in d1">Welcome to HG</p>
            <h1 id="h1" class="in d2">Hummus &amp;<br><span class="ac">Garlic.</span></h1>
            <p class="lede in d3">Hummus is the foundation, garlic is the soul. Bowls, shawarma, wings and sides.</p>
            <div class="btn-row in d4">
                <a class="btn btn-green" href="#">Order Online</a>
                <a class="btn btn-white" href="#"><i class="fas fa-utensils" aria-hidden="true"></i> View Menu</a>
            </div>
        </div>
        <div class="wall in d3" id="wall" aria-label="Photos from Hummus &amp; Garlic" role="img"></div>
    </div>
</section>
<section class="next"><small>What are you craving?</small><h2>Pick your lane.</h2></section>
</main>
<span class="proto-tag">1 · Photo Wall</span>
<script>
if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
// Three columns of shots; each column is drawn twice so the loop never shows a seam.
const b = 'images/site/lifestyle/';
const cols = [
    ['bowl-fork', 'cheers', 'menu-hero-1', 'dessert-hand'],
    ['feature-shawarma', 'pita-table', 'fries-fork', 'giftcard-bowls'],
    ['parfait-spoon', 'feature-bowls', 'bag-wraps', 'table-spread'],
];
const wall = document.getElementById('wall');
cols.forEach(list => {
    const col = document.createElement('div'); col.className = 'col';
    const reel = document.createElement('div'); reel.className = 'reel';
    [...list, ...list].forEach(f => { reel.insertAdjacentHTML('beforeend', `<figure class="card"><img src="${b}${f}@half.webp" srcset="${b}${f}@half.webp 400w, ${b}${f}.webp 800w" sizes="(min-width: 1000px) 16vw, (min-width: 600px) 31vw, 46vw" width="400" height="500" decoding="async" alt=""></figure>`); });
    col.appendChild(reel); wall.appendChild(col);
});
</script>
</body>
</html>
